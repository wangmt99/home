# ============================================================
# Oracle CSV 导入配置文件
# ============================================================

# -------------------- 数据库连接配置 --------------------
DB_HOST=192.168.1.100
DB_PORT=1521
DB_SERVICE=orcl

# 数据库字符集（NLS_LANG），用于解决中文乱码问题
# 常见值：
#   SIMPLIFIED CHINESE_CHINA.ZHS16GBK    数据库为 GBK 编码
#   SIMPLIFIED CHINESE_CHINA.AL32UTF8     数据库为 UTF-8 编码
#   AMERICAN_AMERICA.AL32UTF8             英文环境 UTF-8
# 不设置时默认为 SIMPLIFIED CHINESE_CHINA.ZHS16GBK
NLS_LANG="SIMPLIFIED CHINESE_CHINA.ZHS16GBK"

# CSV 文件编码（脚本内部处理时使用的编码）
# 常见值：UTF-8 / GBK / GB18030
# 不设置时默认与系统 locale 一致，若 CSV 文件编码与系统 locale 不一致请显式指定
CSV_FILE_ENCODING=UTF-8

# SQL 文件编码（执行 sqlplus 前的目标编码）
# 常见值：GBK / GB18030 / UTF-8
# 不设置时默认与 NLS_LANG 保持一致，GBK 数据库建议保持 GBK
SQL_FILE_ENCODING=GBK

# -------------------- nlp 用户配置 --------------------
NLP_USER=nlp
NLP_PASSWORD=nlp_password
NLP_CSV_PATH=/home/nlp/SH_ALL/csv_nlp

# -------------------- stg 用户配置 --------------------
STG_USER=stg
STG_PASSWORD=stg_password
STG_CSV_PATH=/home/nlp/SH_ALl/csv_stg

# -------------------- 文件筛选配置 --------------------
# 指定需要导入的文件名：
#   *           表示导入各用户 CSV 路径下的所有 .csv 文件
#   file1.csv file2.csv   多个文件用空格隔开
#   空（留空）  表示没有文件需要导入，脚本会直接退出
SPECIFIED_FILES=*

# 组合分隔符（字段间分隔符），不设置时默认值为 |~
FIELD_DELIMITER=|~

# 不需要执行的文件（跳过导入），多个文件用空格隔开
# 例如：SKIP_FILES=test.csv temp.csv
SKIP_FILES=

# 仅需要 INSERT 语句的文件（导入前不做 TRUNCATE），多个文件用空格隔开
# 例如：INSERT_ONLY_FILES=log.csv
INSERT_ONLY_FILES=

# -------------------- 日志路径配置 --------------------
# 批处理汇总日志路径（每次执行单独记录一个文件）
BATCH_LOG_PATH=/home/nlp/SH_ALl/logs/batch
# 每个导入文件的独立日志路径
FILE_LOG_PATH=/home/nlp/SH_ALl/logs/files

# -------------------- 并发配置 --------------------
# 最大并发数（同时生成 SQL 或执行 SQL 的任务数）
# 值为 1 时为串行执行（默认）
# 建议值 2-4，过大会增加数据库压力
MAX_PARALLEL=2
